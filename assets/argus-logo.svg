  <text x="120" y="170" fill="#ffffff" font-family="Inter, sans-serif" font-size="64" font-weight="700">argus</text>
  <text x="120" y="230" fill="#a8d7ff" font-family="Inter, sans-serif" font-size="28" letter-spacing="0.08em">LOCAL AI SECURITY FOR GO · PYTHON · RUST</text>
  <text x="120" y="320" fill="#d1e8ff" font-family="Inter, sans-serif" font-size="22" letter-spacing="0.02em" opacity="0.85">Semantic vulnerability scanning with Ollama, DuckDB, and version-aware CVE filtering.</text>
  <text x="120" y="360" fill="#d1e8ff" font-family="Inter, sans-serif" font-size="22" letter-spacing="0.02em" opacity="0.85">Deployable in CI, export results to JSON or SARIF, and keep your code on-prem.</text>
</svg>
