# Argus Vulnerability Scanner — GCP Cloud Build configuration
#
# Usage:
#   gcloud builds submit --config ci-templates/cloudbuild.yaml .
#
# Or trigger automatically from a Cloud Build trigger pointing to this file.
#
# Required secrets (store in Secret Manager, then grant the Cloud Build SA access):
#   openai-api-key   — when using an OpenAI-compatible LLM backend
#
# Optional substitutions (set in trigger or pass with --substitutions):
#   _ARGUS_VERSION      — Docker image tag        (default: latest)
#   _ARGUS_ECOSYSTEMS   — comma-separated list     (default: go,python,rust,npm)
#   _ARGUS_FAIL_ON      — severity threshold       (default: HIGH)
#   _ARGUS_MIN_SEVERITY — minimum severity to show (default: empty = all)
#   _ARGUS_PROJECT_DIR  — directory to scan        (default: .)
#
# Cloud Build cache:
#   This config uses the /workspace volume which is automatically persisted
#   across steps within a single build. For cross-build caching, push/pull
#   the vuln DB to a GCS bucket (see optional step at the bottom).

substitutions:
  _ARGUS_VERSION: "latest"
  _ARGUS_ECOSYSTEMS: "go,python,rust,npm"
  _ARGUS_FAIL_ON: "HIGH"
  _ARGUS_MIN_SEVERITY: ""
  _ARGUS_PROJECT_DIR: "."

availableSecrets:
  secretManager:
    # Remove this block if you are using Ollama instead of OpenAI.
    - versionName: projects/$PROJECT_ID/secrets/openai-api-key/versions/latest
      env: OPENAI_API_KEY

steps:
  # ── Optional: restore DB from GCS cache ────────────────────────────────────
  # Uncomment and replace YOUR_BUCKET to enable cross-build caching.
  #
  # - name: gcr.io/cloud-builders/gsutil
  #   entrypoint: bash
  #   args:
  #     - -c
  #     - |
  #       gsutil cp gs://YOUR_BUCKET/argus-vulns.db /workspace/.argus/vulns.db || true
  #       mkdir -p /workspace/.argus

  # ── Prepare ─────────────────────────────────────────────────────────────────
  - name: bash
    args:
      - -c
      - mkdir -p /workspace/.argus

  # ── Ingest ──────────────────────────────────────────────────────────────────
  - name: ghcr.io/abhishekamralkar/argus:${_ARGUS_VERSION}
    id: ingest
    entrypoint: argus
    args:
      - ingest
      - --db=/workspace/.argus/vulns.db
      - --ecosystems=${_ARGUS_ECOSYSTEMS}
      - --quiet
    secretEnv:
      - OPENAI_API_KEY
    env:
      - OLLAMA_HOST=http://localhost:11434

  # ── Scan ────────────────────────────────────────────────────────────────────
  - name: ghcr.io/abhishekamralkar/argus:${_ARGUS_VERSION}
    id: scan
    entrypoint: bash
    args:
      - -c
      - |
        EXTRA=""
        [ -n "${_ARGUS_MIN_SEVERITY}" ] && EXTRA="--min-severity ${_ARGUS_MIN_SEVERITY}"
        argus scan \
          --db=/workspace/.argus/vulns.db \
          --output=sarif \
          --fail-on=${_ARGUS_FAIL_ON} \
          $EXTRA \
          /workspace/${_ARGUS_PROJECT_DIR} \
        > /workspace/argus-results.sarif
    secretEnv:
      - OPENAI_API_KEY
    env:
      - OLLAMA_HOST=http://localhost:11434

  # ── Optional: save DB to GCS cache ─────────────────────────────────────────
  # Uncomment and replace YOUR_BUCKET to enable cross-build caching.
  #
  # - name: gcr.io/cloud-builders/gsutil
  #   args:
  #     - cp
  #     - /workspace/.argus/vulns.db
  #     - gs://YOUR_BUCKET/argus-vulns.db

artifacts:
  objects:
    location: gs://$PROJECT_ID-build-artifacts/argus/$BUILD_ID/
    paths:
      - /workspace/argus-results.sarif

options:
  logging: CLOUD_LOGGING_ONLY
