name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          # Measure coverage only for internal packages; cmd/ is CLI wiring that
          # requires integration tests, and ingest loaders require live HTTP.
          go test -race -timeout 120s \
            -coverprofile=coverage.out \
            -coverpkg=$(go list ./internal/... | tr '\n' ',') \
            ./internal/...

      - name: Coverage gate (≥ 55%)
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print int($3)}')
          echo "Coverage: ${pct}%"
          if [ "${pct}" -lt 55 ]; then
            echo "Coverage ${pct}% is below 55% threshold" >&2
            exit 1
          fi

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Benchmark (smoke)
        run: go test -bench=. -benchtime=1x -timeout 60s ./internal/store/...

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -ldflags "-X main.Version=${VERSION}" -o argus ./cmd/argus/

      - name: Verify binary
        run: ./argus version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  tag:
    name: Create Release Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.next.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: next
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            new_tag="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "Tagging as ${new_tag}"

      - name: Push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.next.outputs.new_tag }}
          git push origin ${{ steps.next.outputs.new_tag }}

  release-build:
    name: Release Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install arm64 cross-compiler
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.new_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.new_tag }}
          build-args: VERSION=${{ needs.tag.outputs.new_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push bundled image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bundled
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:bundled
            ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.new_tag }}-bundled
          build-args: VERSION=${{ needs.tag.outputs.new_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
